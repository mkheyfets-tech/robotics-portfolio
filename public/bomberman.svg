<title id="title">Bomberman: Project 2, Variant 2</title>
<desc id="desc">The original eight-column, nineteen-row game map, using the original game sprites. The player starts at the top left, a random monster starts at column four, row ten, and the exit is at the bottom right. Four complete rows of destructible walls block the route.</desc>
